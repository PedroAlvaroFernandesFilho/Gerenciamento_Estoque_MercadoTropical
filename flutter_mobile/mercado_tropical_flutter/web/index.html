<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Controle de Estoque - Mercado Tropical">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mercado Tropical">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mercado Tropical</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Remove o fundo branco padrão e aplica a cor base do Mercado Tropical */
    html, body {
      background-color: #06130D;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Esconde aquela barra azul padrão do topo do Flutter Web */
    flt-glass-pane {
      background-color: #06130D;
    }

    /* Container centralizado da Splash Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #06130D;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    /* Estilo direto na imagem (sem caixa e sem borda verde prendendo ela) */
    .logo-img {
      width: 220px; /* Aumente ou diminua este valor se quiser a logo maior ou menor */
      max-width: 75vw;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 24px rgba(0, 214, 101, 0.25));
      animation: pulse 1.8s infinite ease-in-out;
    }

    .app-title {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
    }

    .app-subtitle {
      color: #8E9E95;
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 28px 0;
    }

    /* Spinner de carregamento verde */
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #142E22;
      border-top: 4px solid #00D665;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Tela de carregamento personalizada -->
  <div id="loading-screen">
    <img src="icons/icon-tropical.png" alt="Logo Mercado Tropical" class="logo-img">
    <h1 class="app-title">Mercado Tropical</h1>
    <p class="app-subtitle">Carregando sistema de estoque...</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Assim que o primeiro frame do Flutter for renderizado, remove a tela de loading suavemente
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
